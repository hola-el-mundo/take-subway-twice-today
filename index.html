<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoe's Fun House! 🎈</title>
    <!-- 引入有趣的圆润字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 引入样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- 全屏主视觉区域 (Hero Section) -->
    <main class="hero-section">
        <div class="hero-content">
            <div class="badge">👋 Hello there!</div>
            <h1 class="hero-title">Hey, I'm <span class="highlight">Zoe!</span></h1>
            <p class="hero-subtitle">Creating fun stuff & breaking things on web.</p>
            <div class="social-links">
                <a href="#" class="social-btn instagram">📸 Insta</a>
                <a href="#" class="social-btn twitter">🐦 Twitter</a>
                <a href="#" class="social-btn email">📧 Email</a>
            </div>
        </div>
        
        <!-- 背景装饰元素 (Blobs) -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="sticker sticker-1">✨</div>
        <div class="sticker sticker-2">🚀</div>
    </main>

    <!-- 侧边博客入口：像个扭蛋或者糖果 -->
    <div class="corner-trigger" id="blog-toggle">
        <span class="emoji">📖</span>
        <span class="trigger-text">My Diary</span>
    </div>

    <!-- 隐藏的侧边博客面板 -->
    <aside class="blog-panel" id="blog-panel">
        <button class="close-btn" id="close-blog">✖️</button>
        
        <div class="blog-container">
            <header class="blog-header">
                <h2>📒 Little Notebook</h2>
                <button id="new-post-btn" class="fun-btn">✍️ Write New</button>
            </header>

            <!-- 写作区域 -->
            <div id="editor-area" class="editor-area hidden card-style">
                <input type="text" id="blog-title" placeholder="Today's headlines..." class="fun-input">
                <textarea id="blog-content" placeholder="What's happening? Tell me everything!" class="fun-textarea"></textarea>
                <div class="editor-actions">
                    <button id="publish-btn" class="action-btn primary">Post it!</button>
                    <button id="cancel-btn" class="action-btn secondary">Nah</button>
                </div>
            </div>

            <!-- 列表区域 -->
            <div id="blog-list" class="blog-list">
                <!-- 动态生成 -->
            </div>
        </div>
    </aside>

    <!-- 遮罩层 -->
    <div class="overlay" id="overlay"></div>

    <!-- 引入 LeanCloud SDK -->
    <script src="//code.bdstatic.com/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
    <!-- 脚本引入 -->
    <script type="module" src="js/script.js"></script>
</body>
</html>
