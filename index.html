<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoe's World 🌏</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;500;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="profile">
                <h1>Zoe's Space</h1>
                <p>Welcome!</p>
            </div>
            <nav>
                <button class="nav-btn active" data-target="home">🏠 Home</button>
                <button class="nav-btn" data-target="blog">📝 Blog</button>
                <button class="nav-btn" data-target="guestbook">💬 Guestbook</button>
                <button class="nav-btn" data-target="visitors">👀 Visitors</button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            
            <!-- HOME Section -->
            <section id="home" class="view-section active">
                <div class="hero-card">
                    <h1 class="hero-title">Hi, I'm <span class="highlight">Zoe!</span></h1>
                    <p class="hero-subtitle">Creating fun stuff on the web.</p>
                    <div class="social-links">
                        <a href="#" class="social-chip">📸 Instagram</a>
                        <a href="#" class="social-chip">🐦 Twitter</a>
                        <a href="#" class="social-chip">📧 Email</a>
                    </div>
                </div>
                <!-- Blobs for decoration -->
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
            </section>

            <!-- BLOG Section -->
            <section id="blog" class="view-section">
                <div class="section-header">
                    <h2>My Thoughts</h2>
                    <button id="new-post-btn" class="action-btn primary">+ New Post</button>
                </div>
                
                <!-- Editor (Hidden by default) -->
                <div id="editor-area" class="card-style hidden">
                    <input type="text" id="blog-title" placeholder="Title..." class="fun-input">
                    <textarea id="blog-content" placeholder="What's on your mind?" class="fun-textarea" rows="5"></textarea>
                    <div class="editor-buttons">
                        <button id="publish-btn" class="action-btn primary">Publish</button>
                        <button id="cancel-btn" class="action-btn secondary">Cancel</button>
                    </div>
                </div>

                <div id="blog-list" class="blog-container">
                    <!-- Blogs will be loaded here -->
                </div>
            </section>

            <!-- GUESTBOOK Section -->
            <section id="guestbook" class="view-section">
                <div class="section-header">
                    <h2>Guestbook</h2>
                </div>
                
                <div class="guestbook-form card-style">
                    <input type="text" id="guest-name" placeholder="Your Nickname" class="fun-input">
                    <textarea id="guest-msg" placeholder="Leave a message..." class="fun-textarea" rows="2"></textarea>
                    <button id="send-msg-btn" class="action-btn primary">Send Message</button>
                </div>

                <div id="guestbook-list" class="message-list">
                    <!-- Messages here -->
                </div>
            </section>

            <!-- VISITORS Section -->
            <section id="visitors" class="view-section">
                <div class="section-header">
                    <h2>Who Visited?</h2>
                </div>
                <div class="section-intro">
                    <p>Spying on my visitors... (Logged IPs)</p>
                </div>

                <div class="card-style">
                    <table class="visitors-table">
                        <thead>
                            <tr>
                                <th>IP Address</th>
                                <th>Time</th>
                                <th>Agent</th>
                            </tr>
                        </thead>
                        <tbody id="visitors-list">
                            <!-- Visitor rows -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
