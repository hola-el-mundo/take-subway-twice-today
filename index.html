<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoe's Journal</title>
    <!-- Use loli.net mirror for Google Fonts to accelerate access in China -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@300;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar paper-border">
            <div class="profile">
                <h1>Z.J.</h1>
                <p>Est. 2026</p>
            </div>
            <nav>
                <button class="nav-btn active" data-target="home">Cover</button>
                <button class="nav-btn" data-target="blog">Stories</button>
                <button class="nav-btn" data-target="gallery">Moments</button>
                <button class="nav-btn" data-target="guestbook">Guestbook</button>
                <button class="nav-btn" data-target="visitors">Trace</button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area paper-border">
            
            <!-- HOME Section -->
            <section id="home" class="view-section active">
                <div class="hero-card paper-border">
                    <h1 class="hero-title">Zoe's Journal</h1>
                    <p class="hero-subtitle">"Serious books can be fun too."</p>
                    <div class="social-links">
                        <a href="#" class="social-chip">Instagram</a>
                        <a href="#" class="social-chip">Twitter</a>
                        <a href="#" class="social-chip">Email</a>
                    </div>
                </div>
            </section>

            <!-- BLOG Section -->
            <section id="blog" class="view-section">
                <div class="section-header">
                    <h2>Little Stories</h2>
                    <button id="new-post-btn" class="action-btn primary">Write</button>
                </div>
                
                <!-- Editor (Hidden by default) -->
                <div id="editor-area" class="card-style hidden paper-border">
                    <input type="text" id="blog-title" placeholder="A catchy title..." class="fun-input">
                    <textarea id="blog-content" placeholder="Start writing your story..." class="fun-textarea" rows="5"></textarea>
                    <div class="editor-buttons">
                        <button id="publish-btn" class="action-btn primary">Publish</button>
                        <button id="cancel-btn" class="action-btn secondary">Scrap</button>
                    </div>
                </div>

                <div id="blog-list" class="blog-container">
                    <!-- Blogs will be loaded here -->
                </div>
            </section>

            <!-- GALLERY Section (New) -->
            <section id="gallery" class="view-section">
                <div class="section-header">
                    <h2>Captured Moments</h2>
                    <button id="add-photo-btn" class="action-btn primary">Pin Photo</button>
                </div>

                <div id="photo-input-area" class="card-style hidden paper-border">
                    <input type="text" id="photo-url" placeholder="Image URL..." class="fun-input">
                    <input type="text" id="photo-caption" placeholder="Caption..." class="fun-input">
                    <div class="editor-buttons">
                        <button id="save-photo-btn" class="action-btn primary">Pin It</button>
                        <button id="cancel-photo-btn" class="action-btn secondary">Cancel</button>
                    </div>
                </div>

                <div id="gallery-grid" class="gallery-grid">
                    <!-- Photos here -->
                </div>
            </section>

            <!-- GUESTBOOK Section -->
            <section id="guestbook" class="view-section">
                <div class="section-header">
                    <h2>Guest Signatures</h2>
                </div>
                
                <div class="guestbook-form card-style">
                    <input type="text" id="guest-name" placeholder="Your Nickname" class="fun-input">
                    <textarea id="guest-msg" placeholder="Leave a message..." class="fun-textarea" rows="2"></textarea>
                    <button id="send-msg-btn" class="action-btn primary">Send Message</button>
                </div>

                <div id="guestbook-list" class="message-list">
                    <!-- Messages here -->
                </div>
            </section>

            <!-- VISITORS Section -->
            <section id="visitors" class="view-section">
                <div class="section-header">
                    <h2>Who Visited?</h2>
                </div>
                <div class="section-intro">
                    <p>Spying on my visitors... (Logged IPs)</p>
                </div>

                <div class="card-style">
                    <table class="visitors-table">
                        <thead>
                            <tr>
                                <th>Location</th>
                                <th>Time</th>
                                <th>Device</th>
                            </tr>
                        </thead>
                        <tbody id="visitors-list">
                            <!-- Visitor rows -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
